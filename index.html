<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Far Bank</title>
    <meta
      name="description"
      content="A one-mechanic river-crossing game: one wrong leap and it's over."
    />

    <!--
      The link-preview card: public/card.png, 1200x630 --- replace it. The URL
      resolves against this page, like any link. No og:title/og:description:
      scrapers fall back to the <title> and description above.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23f3efe4'/%3E%3Ccircle cx='11' cy='21' r='6' fill='%2324211d'/%3E%3Ccircle cx='24' cy='14' r='4.5' fill='%2324211d'/%3E%3Ccircle cx='24' cy='14' r='4.5' fill='none' stroke='%23a13f2f' stroke-width='2'/%3E%3C/svg%3E"
    />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <nav aria-label="Primary">
        <a href="./">Home</a>
      </nav>
      <h1>Far Bank</h1>
    </header>
    <main>
      <div id="stage-frame">
        <canvas id="stage" aria-label="Far Bank: a river with stepping stones, one figure at its edge.">
        </canvas>
      </div>
    </main>
    <aside id="side-panel" aria-label="Score and run history">
      <p id="score" aria-live="polite"></p>
      <section id="history">
        <h2>Recent runs</h2>
        <ol id="history-list"></ol>
      </section>
    </aside>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
